services:
  traefik:
    image: "traefik:latest"
    container_name: ${TRAEFIK_CONTAINER_NAME:-traefik}
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    networks:
      - proxy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    command:
      # EntryPoints
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443

      # Docker Provider
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy

      # API
      - --api=true
      - --api.dashboard=true

      # Certificates
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme.json
      - --certificatesresolvers.letsencrypt.acme.keytype=EC384
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web

      # Logs
      - --log.level=INFO
      - --accesslog=true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-data/acme.json:/acme.json
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # Router
      - traefik.http.routers.traefik-secure.entrypoints=websecure
      - traefik.http.routers.traefik-secure.rule=Host(`${TRAEFIK_DOMAIN}`)
      - traefik.http.routers.traefik-secure.service=api@internal
      - traefik.http.routers.traefik-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik-secure.middlewares=traefik-auth@docker,traefik-security@docker

      # Middlewares - BasicAuth
      - traefik.http.middlewares.traefik-auth.basicauth.users=${BASIC_AUTH_USERS}

      # Middlewares - Security Headers
      - traefik.http.middlewares.traefik-security.headers.sslRedirect=true
      - traefik.http.middlewares.traefik-security.headers.forceSTSHeader=true
      - traefik.http.middlewares.traefik-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.traefik-security.headers.stsPreload=true
      - traefik.http.middlewares.traefik-security.headers.stsSeconds=31536000
      - traefik.http.middlewares.traefik-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.traefik-security.headers.browserXssFilter=true
      - traefik.http.middlewares.traefik-security.headers.frameDeny=true

  portainer:
    image: "portainer/portainer-ce:latest"
    container_name: ${PORTAINER_CONTAINER_NAME:-portainer}
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    networks:
      - proxy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./portainer-data:/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # Router
      - traefik.http.routers.portainer-secure.entrypoints=websecure
      - traefik.http.routers.portainer-secure.rule=Host(`${PORTAINER_DOMAIN}`)
      - traefik.http.routers.portainer-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.portainer-secure.middlewares=portainer-auth@docker,portainer-security@docker

      # Service
      - traefik.http.services.portainer.loadbalancer.server.port=9000

      # Middlewares - BasicAuth
      - traefik.http.middlewares.portainer-auth.basicauth.users=${BASIC_AUTH_USERS}

      # Middlewares - Security Headers
      - traefik.http.middlewares.portainer-security.headers.sslRedirect=true
      - traefik.http.middlewares.portainer-security.headers.forceSTSHeader=true
      - traefik.http.middlewares.portainer-security.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.portainer-security.headers.stsPreload=true
      - traefik.http.middlewares.portainer-security.headers.stsSeconds=31536000
      - traefik.http.middlewares.portainer-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.portainer-security.headers.browserXssFilter=true
      - traefik.http.middlewares.portainer-security.headers.frameDeny=true
networks:
  proxy:
    external: true
